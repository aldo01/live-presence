# Lightweight microservices stack (no Cassandra / no Kafka).
# For the full stack with Cassandra + Kafka, use docker-compose.local.yml.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: livepresence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: UTC
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [live-presence-network]

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [live-presence-network]

  # Auth Service (signs JWTs)
  auth:
    build:
      context: ./services/auth
      dockerfile: Dockerfile.local
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/livepresence?currentSchema=auth,public
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      APP_KAFKA_ENABLED: "false"
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      APP_JWT_SECRET: ${JWT_SECRET:-local_dev_secret_key_must_be_at_least_64_characters_long_for_jwt_signing}
      APP_JWT_ACCESS_MINUTES: "15"
      APP_JWT_REFRESH_DAYS: "14"
    ports: ["8081:8081"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [live-presence-network]
    restart: unless-stopped

  # ScyllaDB — Cassandra-compatible, high-throughput store for durable chat
  # history (partitioned by conversation, clustered by time). Dev-mode single
  # node here; scales horizontally to many nodes in production.
  scylladb:
    image: scylladb/scylla:latest
    command: --developer-mode 1 --smp 1 --memory 1G --overprovisioned 1
    volumes:
      - scylla_data:/var/lib/scylla
    ports: ["9042:9042"]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    networks: [live-presence-network]
    restart: unless-stopped

  # RabbitMQ with the STOMP plugin — the external broker relay that lets multiple
  # core instances share one message bus, so WebSocket fan-out works across nodes
  # (a message sent on node A reaches a subscriber connected to node B).
  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-lp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-lppass}
    volumes:
      - ./infrastructure/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq_data:/var/lib/rabbitmq
    ports: ["5672:5672", "15672:15672", "61613:61613"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks: [live-presence-network]
    restart: unless-stopped

  # Core Service (user, presence, chat, feed, notifications)
  core:
    build:
      context: ./services/core
      dockerfile: Dockerfile.local
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/livepresence
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # Durable chat history on ScyllaDB (Cassandra-compatible).
      APP_CASSANDRA_ENABLED: "true"
      SPRING_DATA_CASSANDRA_CONTACT_POINTS: scylladb
      SPRING_DATA_CASSANDRA_PORT: "9042"
      SPRING_DATA_CASSANDRA_KEYSPACE_NAME: livepresence_chat
      SPRING_DATA_CASSANDRA_LOCAL_DATACENTER: datacenter1
      # External STOMP broker relay (RabbitMQ) for multi-node WebSocket fan-out.
      APP_STOMP_RELAY_ENABLED: "true"
      APP_STOMP_RELAY_HOST: rabbitmq
      APP_STOMP_RELAY_PORT: "61613"
      APP_STOMP_RELAY_LOGIN: ${RABBITMQ_USER:-lp}
      APP_STOMP_RELAY_PASSCODE: ${RABBITMQ_PASS:-lppass}
      APP_KAFKA_ENABLED: "false"
      APP_JWT_SECRET: ${JWT_SECRET:-local_dev_secret_key_must_be_at_least_64_characters_long_for_jwt_signing}
      APP_JWT_ACCESS_MINUTES: "15"
      APP_JWT_REFRESH_DAYS: "14"
    ports: ["8090:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      scylladb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [live-presence-network]
    restart: unless-stopped

  # Presence Service (standalone, Redis-only geospatial presence)
  presence:
    build:
      context: ./services/presence
      dockerfile: Dockerfile.local
    environment:
      SERVER_PORT: 8083
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_JWT_SECRET: ${JWT_SECRET:-local_dev_secret_key_must_be_at_least_64_characters_long_for_jwt_signing}
    ports: ["8083:8083"]
    depends_on:
      redis:
        condition: service_healthy
    networks: [live-presence-network]
    restart: unless-stopped

  # Notification Service (standalone; Postgres storage + Redis pub/sub bridge)
  notification:
    build:
      context: ./services/notification
      dockerfile: Dockerfile.local
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/livepresence
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_JWT_SECRET: ${JWT_SECRET:-local_dev_secret_key_must_be_at_least_64_characters_long_for_jwt_signing}
    ports: ["8085:8085"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [live-presence-network]
    restart: unless-stopped

  # Feed Service (standalone; posts/comments/likes/reactions). Kafka disabled here.
  feed:
    build:
      context: ./services/feed
      dockerfile: Dockerfile.local
    environment:
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/livepresence
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_KAFKA_ENABLED: "false"
      APP_JWT_SECRET: ${JWT_SECRET:-local_dev_secret_key_must_be_at_least_64_characters_long_for_jwt_signing}
    ports: ["8086:8086"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [live-presence-network]
    restart: unless-stopped

  # SeaweedFS — distributed, S3-compatible object storage built for billions of
  # files (the hyperscale blob store). Runs all-in-one here (master+volume+filer
  # +S3 gateway). SSE-S3 (AES-256 server-side encryption at rest, per-object DEKs
  # wrapped by a KEK) is enabled via the KEK passphrase below and applied as the
  # bucket's default policy by the media service; TLS covers transit in prod.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: >
      server -dir=/data -ip=seaweedfs
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=1024
    environment:
      # Enables SSE-S3: a 256-bit key is derived from this secret via HKDF-SHA256
      # and used to encrypt every object at rest (per-object DEK wrapped by it).
      WEED_S3_SSE_KEY: ${SEAWEED_SSE_KEY:-lp-sse-master-secret-change-me-in-prod-please}
      WEED_S3_SSE_KEK_PASSPHRASE: ${SEAWEED_SSE_PASSPHRASE:-lp-sse-kek-passphrase-change-me-in-prod}
    volumes:
      - seaweed_data:/data
      - ./infrastructure/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports: ["8333:8333", "9333:9333", "8888:8888"]
    networks: [live-presence-network]
    restart: unless-stopped

  # Media Service — issues presigned upload/download URLs and runs the image
  # optimization worker (resize + thumbnails). Bytes never pass through it.
  media:
    build:
      context: ./services/media
      dockerfile: Dockerfile.local
    environment:
      SERVER_PORT: 8087
      APP_JWT_SECRET: ${JWT_SECRET:-local_dev_secret_key_must_be_at_least_64_characters_long_for_jwt_signing}
      MEDIA_S3_ENDPOINT: http://seaweedfs:8333
      MEDIA_S3_PUBLIC_ENDPOINT: ${MEDIA_S3_PUBLIC_ENDPOINT:-http://localhost:8333}
      MEDIA_S3_ACCESS_KEY: lp-media-access
      MEDIA_S3_SECRET_KEY: lp-media-secret-change-me
      MEDIA_S3_BUCKET: media
    ports: ["8087:8087"]
    depends_on:
      seaweedfs:
        condition: service_started
    networks: [live-presence-network]
    restart: unless-stopped

  # API Gateway — single public entry point
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile.local
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      # Gateway pins Spring Cloud to a release train that predates this Boot
      # version; the strict compatibility check is not needed for local dev.
      SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED: "false"
      # RequestRateLimiter's default key resolver returns an empty key for
      # anonymous requests; with deny-empty-key=true that 403s login/register.
      SPRING_CLOUD_GATEWAY_FILTER_REQUEST_RATE_LIMITER_DENY_EMPTY_KEY: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_SSL_ENABLED: "false"
      JWT_SECRET: ${JWT_SECRET:-local_dev_secret_key_must_be_at_least_64_characters_long_for_jwt_signing}
      AUTH_SERVICE_URI: http://auth:8081
      CORE_SERVICE_URI: http://core:8080
      # SockJS first does a plain-HTTP GET /ws/info before upgrading. Spring
      # Cloud Gateway proxies that as normal HTTP and auto-switches to ws:// only
      # when it sees the Upgrade header — so the route must use http://, not ws://
      # (a ws:// scheme makes the gateway 400 the non-upgrade /ws/info request).
      CORE_SERVICE_WS_URI: http://core:8080
      PRESENCE_SERVICE_URI: http://presence:8083
      NOTIFICATION_SERVICE_URI: http://notification:8085
      FEED_SERVICE_URI: http://feed:8086
      MEDIA_SERVICE_URI: http://media:8087
    ports: ["8080:8080"]
    depends_on:
      redis:
        condition: service_healthy
      auth:
        condition: service_started
      core:
        condition: service_started
      presence:
        condition: service_started
      notification:
        condition: service_started
      feed:
        condition: service_started
      media:
        condition: service_started
    networks: [live-presence-network]
    restart: unless-stopped

  # Frontend — talks only to the gateway
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile.local
    environment:
      VITE_API_BASE_URL: http://localhost:8080
      # Optional: set MAPTILER_KEY in your shell/.env for premium MapTiler vector
      # styles. If unset, the map falls back to the free, no-key OpenFreeMap style.
      VITE_MAPTILER_KEY: ${MAPTILER_KEY:-}
    ports: ["3000:3000"]
    depends_on: [gateway]
    networks: [live-presence-network]
    restart: unless-stopped

volumes:
  pgdata:
  seaweed_data:
  scylla_data:
  rabbitmq_data:

networks:
  live-presence-network:
    driver: bridge
