services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: presence
      POSTGRES_USER: presence
      POSTGRES_PASSWORD: presence
      TZ: Asia/Kolkata
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/presence
      SPRING_DATASOURCE_USERNAME: presence
      SPRING_DATASOURCE_PASSWORD: presence
      SPRING_DATA_REDIS_HOST: redis
      APP_JWT_SECRET: "CHANGE_ME_TO_A_LONG_RANDOM_SECRET_AT_LEAST_64_CHARS_1234567890"
      APP_JWT_ACCESS_MINUTES: "15"
      APP_JWT_REFRESH_DAYS: "14"
    depends_on: [postgres, redis]
    ports: ["8080:8080"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["3000:80"]

volumes:
  pgdata:
