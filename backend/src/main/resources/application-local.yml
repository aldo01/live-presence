server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/livepresence}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  cassandra:
    enabled: false
    contact-points: localhost:9042
    keyspace-name: live_presence
    port: 9042

app:
  jwt:
    secret: dev_secret_key_minimum_32_characters_required_for_jwt_signing_and_verification
    accessMinutes: 15
    refreshDays: 14

logging:
  level:
    org.springframework.security: INFO
    org.springframework.data.cassandra: OFF
    com.datastax: OFF
