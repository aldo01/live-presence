server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/livepresence}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none  # Disable schema validation - we use Flyway for schema management
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
    cassandra:
      keyspace-name: ${SPRING_DATA_CASSANDRA_KEYSPACE_NAME:live_presence}
      contact-points: ${SPRING_DATA_CASSANDRA_CONTACT_POINTS:localhost:9042}
      local-datacenter: ${SPRING_DATA_CASSANDRA_LOCAL_DATACENTER:datacenter1}
      schema-action: ${SPRING_DATA_CASSANDRA_SCHEMA_ACTION:none}
      port: 9042
      session-name: default

app:
  jwt:
    secret: ${APP_JWT_SECRET:dev_secret_key_minimum_32_characters_required_for_jwt_signing_and_verification}
    accessMinutes: ${APP_JWT_ACCESS_MINUTES:15}
    refreshDays: ${APP_JWT_REFRESH_DAYS:14}

logging:
  level:
    org.springframework.security: INFO
