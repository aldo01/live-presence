server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/livepresence}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
    cassandra:
      enabled: ${APP_CASSANDRA_ENABLED:false}
      contact-points: ${SPRING_DATA_CASSANDRA_CONTACT_POINTS:localhost:9042}
      keyspace-name: ${SPRING_DATA_CASSANDRA_KEYSPACE_NAME:live_presence}
      port: ${SPRING_DATA_CASSANDRA_PORT:9042}

app:
  jwt:
    secret: dev_secret_key_minimum_32_characters_required_for_jwt_signing_and_verification
    accessMinutes: 15
    refreshDays: 14

logging:
  level:
    org.springframework.security: INFO
    org.springframework.data.cassandra: OFF
    com.datastax: OFF
