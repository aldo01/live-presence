plugins {
  id 'java'
  id 'org.springframework.boot' version '3.3.5'
  id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.livepresence'
version = '1.0.0'

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

repositories { mavenCentral() }

dependencyManagement {
  imports {
    mavenBom 'software.amazon.awssdk:bom:2.28.29'
  }
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-security'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'

  // S3-compatible object storage (MinIO locally, S3 in prod) — presign + ops.
  implementation 'software.amazon.awssdk:s3'

  // Pure-Java image resizing for the display/thumbnail variants (no native libs,
  // so it runs fine on the Alpine JRE). WebP/AVIF can be swapped in later.
  implementation 'net.coobird:thumbnailator:0.4.20'

  implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
  runtimeOnly  'io.jsonwebtoken:jjwt-impl:0.12.6'
  runtimeOnly  'io.jsonwebtoken:jjwt-jackson:0.12.6'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.withType(Test).configureEach { useJUnitPlatform() }
