server:
  port: 8080

spring:
  application:
    name: gateway
  # SockJS can fall back from raw WebSocket to xhr_send, which POSTs each STOMP
  # frame as an HTTP body through the gateway. Chat photos are inlined as base64,
  # so raise the reactive codec buffer above the 256 KB default to let those
  # frames through on the fallback transport too.
  codec:
    max-in-memory-size: 10MB
  cloud:
    gateway:
      # The gateway owns CORS (see globalcors below), but the downstream Spring
      # services also emit CORS headers on proxied responses. That yields two
      # Access-Control-Allow-Origin values, which browsers reject ("multiple
      # values ... only one is allowed"). Collapse any duplicates to a single
      # value so real browser requests (not just curl) succeed.
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_UNIQUE
      routes:
        # Auth service (public). Controller base path is /api/auth, so DO NOT rewrite.
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40

        # Core service WebSocket. STOMP auth is handled in-app via the CONNECT
        # frame, so the gateway AuthenticationFilter is intentionally omitted here.
        - id: core-ws
          uri: ${CORE_SERVICE_WS_URI:http://localhost:8090}
          predicates:
            - Path=/ws/**

        # Presence service (standalone, Redis-only). Its controllers expect the
        # full /api/presence/** path, so DO NOT rewrite.
        - id: presence-service
          uri: ${PRESENCE_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/presence/**
          filters:
            - AuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200

        # Notification service (standalone). Its controllers expect the full
        # /api/notifications/** path, so DO NOT rewrite.
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/notifications/**
          filters:
            - AuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200

        # Vibe catalog (public reference data, served by the feed service). No
        # AuthenticationFilter: the catalog is non-sensitive and cacheable.
        - id: vibe-catalog
          uri: ${FEED_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/vibes/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200

        # Public, auth-free media (avatars) served as stable cacheable URLs so
        # <img>/CSS url() can load them anywhere. MUST precede media-service so it
        # matches first and skips the AuthenticationFilter.
        - id: media-public
          uri: ${MEDIA_SERVICE_URI:http://localhost:8087}
          predicates:
            - Path=/api/media/public/**

        # Media service (presigned upload/download URLs + image optimization).
        - id: media-service
          uri: ${MEDIA_SERVICE_URI:http://localhost:8087}
          predicates:
            - Path=/api/media/**
          filters:
            - AuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200

        # Feed service (standalone). Its controllers expect the full
        # /api/posts/** path, so DO NOT rewrite.
        - id: feed-service
          uri: ${FEED_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/posts/**
          filters:
            - AuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200

        # Core service (user, chat). Core controllers
        # expect the full /api/** path, so DO NOT rewrite. Currently these domains
        # all live in the core deployable; when they are split out, only the target
        # URIs below change.
        - id: core-service
          uri: ${CORE_SERVICE_URI:http://localhost:8090}
          predicates:
            - Path=/api/me/**,/api/users/**,/api/conversations/**
          filters:
            - AuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
      
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

jwt:
  secret: ${JWT_SECRET:local_dev_secret_key_must_be_at_least_64_characters_long_for_jwt_signing}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.livepresence: DEBUG
    org.springframework.cloud.gateway: DEBUG
