server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: notification-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/livepresence}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      pool-name: notification-pool

  jpa:
    hibernate:
      # The notifications table (with FKs into core tables) is owned by core's
      # Flyway migration. This service maps to the existing table only.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # Flyway intentionally disabled: core owns the shared schema DDL.
  flyway:
    enabled: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

app:
  jwt:
    # MUST match the secret used by the auth service (signer) and the gateway.
    secret: ${APP_JWT_SECRET:dev_secret_key_minimum_32_characters_required_for_jwt_signing_and_verification}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.security: INFO
