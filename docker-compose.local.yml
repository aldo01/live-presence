services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: live-presence-postgres
    environment:
      POSTGRES_DB: livepresence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - live-presence-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: live-presence-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - live-presence-network

  # Cassandra Database for Message Storage
  cassandra:
    image: cassandra:4.1
    container_name: live-presence-cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: live-presence-cluster
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_NUM_TOKENS: 256
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
      CASSANDRA_LISTEN_ADDRESS: cassandra
      CASSANDRA_RPC_ADDRESS: cassandra
      CASSANDRA_BROADCAST_ADDRESS: cassandra
      CASSANDRA_BROADCAST_RPC_ADDRESS: cassandra
    ports:
      - "9042:9042"
      - "7000:7000"
    volumes:
      - cassandra_data:/var/lib/cassandra
      - ./scripts/cassandra-init.cql:/docker-entrypoint-initdb.d/init.cql
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - live-presence-network

  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: live-presence-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - live-presence-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka Message Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: live-presence-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - live-presence-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Auth Service (signs JWTs) — dedicated microservice
  auth:
    build:
      context: ./services/auth
      dockerfile: Dockerfile.local
    container_name: live-presence-auth
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/livepresence?currentSchema=auth,public
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_KAFKA_ENABLED: "false"
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      APP_JWT_SECRET: ${JWT_SECRET:-local_dev_secret_key_must_be_at_least_64_characters_long_for_jwt_signing}
      APP_JWT_ACCESS_MINUTES: 15
      APP_JWT_REFRESH_DAYS: 14
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - live-presence-network
    restart: unless-stopped

  # Core Service (user, presence, chat, feed, notifications) — to be split further
  core:
    build:
      context: ./services/core
      dockerfile: Dockerfile.local
    container_name: live-presence-core
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/livepresence
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_CASSANDRA_CONTACT_POINTS: cassandra:9042
      SPRING_DATA_CASSANDRA_KEYSPACE_NAME: live_presence
      SPRING_DATA_CASSANDRA_LOCAL_DATACENTER: dc1
      SPRING_DATA_CASSANDRA_SCHEMA_ACTION: CREATE_IF_NOT_EXISTS
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_CONSUMER_GROUP_ID: live-presence-consumer-group
      SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: earliest
      APP_CASSANDRA_ENABLED: "false"
      APP_KAFKA_ENABLED: "false"
      APP_JWT_SECRET: ${JWT_SECRET:-local_dev_secret_key_must_be_at_least_64_characters_long_for_jwt_signing}
      APP_JWT_ACCESS_MINUTES: 15
      APP_JWT_REFRESH_DAYS: 14
    # Exposed on 8090 for direct debugging; clients should go through the gateway.
    ports:
      - "8090:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - live-presence-network
    restart: unless-stopped

  # Presence Service (standalone, Redis-only geospatial presence)
  presence:
    build:
      context: ./services/presence
      dockerfile: Dockerfile.local
    container_name: live-presence-presence
    environment:
      SERVER_PORT: 8083
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_JWT_SECRET: ${JWT_SECRET:-local_dev_secret_key_must_be_at_least_64_characters_long_for_jwt_signing}
    ports:
      - "8083:8083"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - live-presence-network
    restart: unless-stopped

  # Notification Service (standalone; Postgres for storage, Redis pub/sub bridge)
  notification:
    build:
      context: ./services/notification
      dockerfile: Dockerfile.local
    container_name: live-presence-notification
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/livepresence
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_JWT_SECRET: ${JWT_SECRET:-local_dev_secret_key_must_be_at_least_64_characters_long_for_jwt_signing}
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - live-presence-network
    restart: unless-stopped

  # Feed Service (standalone; posts/comments/likes/reactions + Kafka fan-out producer)
  feed:
    build:
      context: ./services/feed
      dockerfile: Dockerfile.local
    container_name: live-presence-feed
    environment:
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/livepresence
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_KAFKA_ENABLED: "true"
      APP_JWT_SECRET: ${JWT_SECRET:-local_dev_secret_key_must_be_at_least_64_characters_long_for_jwt_signing}
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - live-presence-network
    restart: unless-stopped

  # API Gateway — single public entry point (routing, rate limiting, JWT, CORS)
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile.local
    container_name: live-presence-gateway
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_SSL_ENABLED: "false"
      JWT_SECRET: ${JWT_SECRET:-local_dev_secret_key_must_be_at_least_64_characters_long_for_jwt_signing}
      AUTH_SERVICE_URI: http://auth:8081
      CORE_SERVICE_URI: http://core:8080
      CORE_SERVICE_WS_URI: ws://core:8080
      PRESENCE_SERVICE_URI: http://presence:8083
      NOTIFICATION_SERVICE_URI: http://notification:8085
      FEED_SERVICE_URI: http://feed:8086
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      auth:
        condition: service_started
      core:
        condition: service_started
      presence:
        condition: service_started
      notification:
        condition: service_started
      feed:
        condition: service_started
    networks:
      - live-presence-network
    restart: unless-stopped

  # Frontend — talks only to the gateway
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile.local
    container_name: live-presence-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    # Use built image content for frontend to avoid host-volume permission issues
    networks:
      - live-presence-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  cassandra_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_logs:
    driver: local
  kafka_data:
    driver: local

networks:
  live-presence-network:
    driver: bridge