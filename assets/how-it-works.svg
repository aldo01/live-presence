<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="How Live Presence works in three steps">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="a1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="a2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="a3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ec4899"/><stop offset="1" stop-color="#f43f5e"/></linearGradient>
    <style>
      .t { font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
      .h { font-weight:800; } .p { font-weight:500; }
    </style>
  </defs>

  <rect width="1280" height="320" fill="#ffffff"/>

  <!-- connecting dashed line -->
  <path d="M250 160 H1030" stroke="#c4b5fd" stroke-width="3" stroke-dasharray="3 10" stroke-linecap="round"/>

  <!-- Step 1: Go live -->
  <g transform="translate(40,40)">
    <rect width="360" height="240" rx="24" fill="url(#card)" stroke="#ede9fe" stroke-width="2"/>
    <g transform="translate(40,44)">
      <circle cx="36" cy="36" r="36" fill="url(#a1)"/>
      <path d="M36 16 c-11 0 -20 9 -20 20 c0 14 20 32 20 32 s20 -18 20 -32 c0 -11 -9 -20 -20 -20 z" fill="#ffffff"/>
      <circle cx="36" cy="36" r="8" fill="#6366f1"/>
    </g>
    <text class="t h" x="40" y="156" font-size="26" fill="#1e1b4b">1 · Go Live</text>
    <text class="t p" x="40" y="190" font-size="17" fill="#4b5563">Share your location and pick</text>
    <text class="t p" x="40" y="214" font-size="17" fill="#4b5563">the vibe you're feeling today.</text>
  </g>

  <!-- Step 2: See vibes near you -->
  <g transform="translate(460,40)">
    <rect width="360" height="240" rx="24" fill="url(#card)" stroke="#e0f2fe" stroke-width="2"/>
    <g transform="translate(40,44)">
      <circle cx="36" cy="36" r="36" fill="url(#a2)"/>
      <circle cx="36" cy="36" r="24" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="3"/>
      <circle cx="36" cy="36" r="13" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3"/>
      <circle cx="54" cy="22" r="5" fill="#fde047"/>
      <circle cx="22" cy="52" r="5" fill="#fca5a5"/>
    </g>
    <text class="t h" x="40" y="156" font-size="26" fill="#0c4a6e">2 · Discover</text>
    <text class="t p" x="40" y="190" font-size="17" fill="#4b5563">See who's around on a live</text>
    <text class="t p" x="40" y="214" font-size="17" fill="#4b5563">map — filter by any vibe.</text>
  </g>

  <!-- Step 3: Connect & chat -->
  <g transform="translate(880,40)">
    <rect width="360" height="240" rx="24" fill="url(#card)" stroke="#fce7f3" stroke-width="2"/>
    <g transform="translate(40,44)">
      <circle cx="36" cy="36" r="36" fill="url(#a3)"/>
      <rect x="18" y="22" width="36" height="24" rx="8" fill="#ffffff"/>
      <path d="M26 46 l0 8 l10 -8 z" fill="#ffffff"/>
      <circle cx="28" cy="34" r="3" fill="#ec4899"/><circle cx="36" cy="34" r="3" fill="#ec4899"/><circle cx="44" cy="34" r="3" fill="#ec4899"/>
    </g>
    <text class="t h" x="40" y="156" font-size="26" fill="#831843">3 · Connect</text>
    <text class="t p" x="40" y="190" font-size="17" fill="#4b5563">Hover a pin, say hi, and chat</text>
    <text class="t p" x="40" y="214" font-size="17" fill="#4b5563">in real time — files included.</text>
  </g>
</svg>
